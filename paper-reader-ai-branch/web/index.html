<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeX论文阅读工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">CODEX PAPER WORKBENCH</p>
          <h1>CodeX论文阅读工作台</h1>
          <p class="subtitle">集中展示论文原文、译文、笔记与问答沉淀，支持实时查看和管理。</p>
        </div>
        <span id="liveStatus" class="live-indicator">实时连接中…</span>
      </header>

      <nav class="top-nav" aria-label="主功能">
        <div class="top-nav-tabs">
          <button class="feature-tab active" data-feature-tab="dashboard" type="button">论文卡片</button>
          <button class="feature-tab" data-feature-tab="summary" type="button">论文总览</button>
        </div>
        <section class="stats stats-inline" id="stats"></section>
      </nav>

      <section class="feature-panel active" data-feature-panel="dashboard">
        <section class="panel cards-panel">
          <div class="section-head">
            <h2>论文卡片</h2>
            <p id="resultMeta">正在加载…</p>
          </div>
          <div class="controls controls-compact">
            <div class="control control-search">
              <label for="searchInput">关键词</label>
              <input id="searchInput" type="search" placeholder="标题 / 作者 / 会议 / 分类" />
            </div>
            <div class="control">
              <label for="categoryFilter">分类</label>
              <select id="categoryFilter">
                <option value="all">全部分类</option>
              </select>
            </div>
            <div class="control">
              <label for="aiStatusFilter">AI进度</label>
              <select id="aiStatusFilter">
                <option value="all">全部状态</option>
                <option value="待整理">待整理</option>
                <option value="待元数据">待元数据</option>
                <option value="待摘要">待摘要</option>
                <option value="待翻译">待翻译</option>
                <option value="待笔记">待笔记</option>
                <option value="待校对">待校对</option>
                <option value="已完成">已完成</option>
              </select>
            </div>
            <div class="control">
              <label for="readingStatusFilter">阅读状态</label>
              <select id="readingStatusFilter">
                <option value="all">全部状态</option>
                <option value="待读">待读</option>
                <option value="在读">在读</option>
                <option value="已读">已读</option>
              </select>
            </div>
          </div>
          <p class="dashboard-hint">点标题进入阅读页，可并排查看原文、翻译、笔记与问答沉淀。</p>
          <div id="cardsScroll" class="cards-scroll">
            <div id="cards" class="cards"></div>
          </div>
        </section>
      </section>

      <section class="feature-panel" data-feature-panel="summary" hidden>
        <section class="panel summary-panel">
          <div class="section-head compact">
            <div>
              <h2>论文总览</h2>
              <p>统一查看、筛选与维护论文条目。</p>
            </div>
          </div>
          <div class="summary-toolbar">
            <p id="summarySelectionMeta" class="summary-selection-meta">已选 0 项</p>
            <div class="summary-toolbar-actions">
              <button class="secondary-btn" id="summaryEditSelectedBtn" type="button" disabled>编辑所选</button>
              <button class="secondary-btn danger-btn" id="summaryDeleteSelectedBtn" type="button" disabled>删除所选</button>
            </div>
          </div>
          <div class="summary-column-control" aria-label="字段显示控制">
            <span class="summary-column-control-label">字段显示</span>
            <div id="summaryColumnToggles" class="summary-column-toggles" role="group" aria-label="切换表格字段显示"></div>
          </div>
          <div class="table-wrap summary-table-wrap">
            <table class="summary-table">
              <colgroup>
                <col class="summary-col-check" />
                <col class="summary-col-title" />
                <col class="summary-col-category" />
                <col class="summary-col-published" />
                <col class="summary-col-imported" />
                <col class="summary-col-last-opened" />
                <col class="summary-col-ai" />
                <col class="summary-col-reading" />
                <col class="summary-col-venue" />
                <col class="summary-col-actions" />
              </colgroup>
              <thead>
                <tr>
                  <th class="summary-col-checkbox">
                    <input id="summarySelectAll" type="checkbox" aria-label="全选可见条目" />
                  </th>
                  <th class="summary-col-title"><button class="sort-btn" type="button" data-action="sort-summary" data-key="title">标题</button></th>
                  <th class="summary-col-category"><button class="sort-btn" type="button" data-action="sort-summary" data-key="category">分类</button></th>
                  <th class="summary-col-published"><button class="sort-btn" type="button" data-action="sort-summary" data-key="publishedAt">发表时间</button></th>
                  <th class="summary-col-imported"><button class="sort-btn" type="button" data-action="sort-summary" data-key="importedAt">导入时间</button></th>
                  <th class="summary-col-last-opened"><button class="sort-btn" type="button" data-action="sort-summary" data-key="lastOpenedAt">最后打开</button></th>
                  <th class="summary-col-ai"><button class="sort-btn" type="button" data-action="sort-summary" data-key="aiStatus">AI状态</button></th>
                  <th class="summary-col-reading"><button class="sort-btn" type="button" data-action="sort-summary" data-key="readingStatus">阅读状态</button></th>
                  <th class="summary-col-venue"><button class="sort-btn" type="button" data-action="sort-summary" data-key="venue">会议</button></th>
                  <th class="summary-col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>

    <div id="cardModal" class="card-modal" hidden>
      <div class="card-modal-backdrop" data-action="close-card-modal"></div>
      <article class="card-modal-panel" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
        <button class="card-modal-close" type="button" data-action="close-card-modal" aria-label="关闭">×</button>
        <h3 id="cardModalTitle">论文详情</h3>
        <p id="cardModalMeta" class="meta"></p>
        <div id="cardModalStatus"></div>
        <div id="cardModalTags" class="tags"></div>
        <section class="card-modal-section">
          <h4>摘要</h4>
          <p id="cardModalSummary" class="card-summary"></p>
        </section>
        <section class="card-modal-section">
          <h4>关键信息</h4>
          <ul id="cardModalTakeaways" class="detail-list"></ul>
        </section>
        <p id="cardModalNext" class="card-next"></p>
        <div id="cardModalActions" class="card-actions"></div>
      </article>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
